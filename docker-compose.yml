services:

  # ── AI Workflow Backend (FastAPI) ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-workflow-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./automation.db:/app/automation.db
    depends_on:
      - n8n
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MongoDB (for incident-api) ────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: incident-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # ── Incident API (Node.js) ────────────────────────────────────────────────
  incident-api:
    build:
      context: ./incident-api
      dockerfile: Dockerfile
    container_name: incident-api
    environment:
      - PORT=8001
      - MONGODB_URI=mongodb://mongodb:27017/incidents
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
    restart: unless-stopped

  # ── Incident Dashboard (React/Vite) ───────────────────────────────────────
  incident-dashboard:
    build:
      context: ./incident-dashboard
      dockerfile: Dockerfile
    container_name: incident-dashboard
    environment:
      - VITE_API_BASE=http://localhost:8001
    ports:
      - "3000:80"
    depends_on:
      - incident-api
    restart: unless-stopped

  # ── Metrics Simulator ─────────────────────────────────────────────────────
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: metrics-simulator
    environment:
      - SERVICE_NAME=payment-service
      - BASE_ERROR_RATE=0.02
      - SPIKE_ERROR_RATE=0.35
      - BASE_LATENCY_MS=180
      - SPIKE_LATENCY_MS=1400
      - BASE_DB_POOL_UTIL=40
      - SPIKE_DB_POOL_UTIL=95
      - SPIKE_EVERY_SECONDS=120
      - SPIKE_DURATION_SECONDS=30
      - LOG_FILE=/var/log/sim/app.log
    ports:
      - "9000:9000"
    volumes:
      - simulator_logs:/var/log/sim
    restart: unless-stopped

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - simulator
    restart: unless-stopped

  # ── Loki ──────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
    restart: unless-stopped

  # ── Promtail ──────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - simulator_logs:/var/log/sim:ro
    depends_on:
      - loki
      - simulator
    restart: unless-stopped

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # ── n8n (Workflow Orchestration) ──────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - WEBHOOK_URL=http://n8n:5678/
      - N8N_LOG_LEVEL=info
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows:ro
    restart: unless-stopped

volumes:
  mongo_data:
  grafana_data:
  n8n_data:
  simulator_logs:
