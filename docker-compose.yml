services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-workflow-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n:latest
    container_name: ai-workflow-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_BASIC_AUTH_ACTIVE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:

